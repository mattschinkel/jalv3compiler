name: 'Compile gate'

# The local gate ladder (unit-tests/run_gates.sh) is the real quality bar, but
# it needs gpsim + QEMU and only ever ran on one machine. These jobs run the
# part that needs nothing but a C compiler and python: build, the corpus, the
# negative table, the compile-pin groups, the committed HEX manifest, static
# analysis, fuzzing, ASan and coverage. That is L1 (plus the nightly extras)
# minus the simulators, and it is what a pull request gets checked against.
#
# Deliberately NOT here: any runtime gate (gpsim / PIC32 / ESP32 QEMU). Those
# stay local -- see unit-tests/run_gates.sh --level 1. A green run here says
# the compiler builds, compiles the corpus and produces the committed HEX; it
# does NOT say the emitted code runs.
#
# Two push-time jobs, not one: static analysis is a heuristic gate and a
# single false positive used to skip the corpus, the negative table and the
# pins entirely (2026-11-01: four pushes, one -fanalyzer false positive in
# pic_proc_leave). It now fails its own check, in parallel, and cannot mask
# the gates that answer "does it still compile the world?".
#
# Toolchain pinned to ubuntu-24.04 on every job: analyzer_baseline.txt keys
# carry the function a warning came from, and GCC renames analyzer kinds and
# moves attribution between majors, so the gate must not silently ride
# ubuntu-latest to a new compiler. When the image moves, regenerate the
# baseline in the same change (unit-tests/run_analyzer.sh --update-baseline).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly: the expensive checks that are still runner-feasible. Sized
    # locally end to end at ~12 min (see the job comments).
    - cron: '17 4 * * *'

jobs:
  compile-gate:
    name: build + corpus + pins
    # push / PR / manual: the fast gate. The nightly job below covers the
    # expensive work; a schedule run must not duplicate this one.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          cc --version | head -1
          python3 --version

      - name: Build (strict C89, -Werror)
        run: make -C src ARCH=x86-64

      - name: Fetch the pinned jallib corpus
        run: unit-tests/fetch_jallib.sh

      - name: Corpus compile (0 errors / 0 warnings)
        run: |
          python3 unit-tests/unittests.py --current \
            --compiler ./bin/beta/jalv3-x86-64 --parallel 4

      # The corpus step already wrote the HEX tree, so byte-identity costs
      # nothing extra here. This is the property a "compiles cleanly" run
      # cannot see: codegen that moved without the manifest being refreshed
      # in the same commit. `diff` exits 1 on any changed/added/removed HEX.
      - name: HEX manifest (codegen byte-identity)
        run: |
          set -o pipefail
          python3 unit-tests/hex_manifest.py diff | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Negative table (expected refusals)
        run: |
          python3 unit-tests/run_negative_tests.py \
            --compiler ./bin/beta/jalv3-x86-64 --jobs 4

      - name: Compile pins (diagnostics + implementation-defined codegen shapes)
        run: unit-tests/run_compile_pin_tests.sh ./bin/beta/jalv3-x86-64

      - name: Upload the compiler and corpus output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jalv3-x86-64-debug
          path: |
            bin/beta/jalv3-x86-64
            unit-tests/Output_Current/full_output
          if-no-files-found: ignore

  analyzer:
    name: static analysis (-fanalyzer)
    # Its own check so a heuristic finding cannot skip the corpus/pins job.
    # A manual dispatch runs the nightly job, which carries the same step, so
    # this one stays out of dispatch rather than running it twice.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: cc --version | head -1

      # -fanalyzer needs the generated jal_build.h, so this job builds too.
      # 20 s, and it also means a broken TU fails as a build error here
      # rather than as a quiet missing-findings result.
      - name: Build (strict C89, -Werror)
        run: make -C src ARCH=x86-64

      - name: Static analysis (-fanalyzer, gated on a baseline)
        # Fails only on findings not in unit-tests/analyzer_baseline.txt.
        # A failing run emits ::error annotations, so the key is visible on
        # the run page without downloading the log (which needs a token).
        run: unit-tests/run_analyzer.sh

  nightly:
    name: nightly (20k fuzz + ASan corpus)
    # Schedule only, or manual (workflow_dispatch then runs BOTH jobs as a
    # full rehearsal). Timings measured locally 2026-10-31: build 30 s,
    # corpus 45 s, ASan corpus 78 s, 20 000 fuzz inputs 363 s, analyzer
    # 76 s, coverage 50 s -- about 12 minutes, well inside the 60-minute cap.
    # Triggerable three ways: the nightly timer, the Actions "Run workflow"
    # button, or -- so it can be started from a terminal without `gh` -- a
    # push whose head commit message contains [nightly]. The last one exists
    # because dispatch needs an authenticated API call and a plain push does
    # not.
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[nightly]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: cc --version | head -1

      - name: Build (strict C89, -Werror)
        run: make -C src ARCH=x86-64

      - name: Fetch the pinned jallib corpus
        run: unit-tests/fetch_jallib.sh

      # 20 000 mutated inputs through the in-process seam. The per-PR gate
      # runs 4 000 fixed-seed inputs in ~20 s; this is 5x the corpus, which
      # is what a nightly is for. Measured 363 s.
      - name: Fuzz (20 000 inputs, in-process)
        run: |
          python3 unit-tests/fuzz_jal_inputs.py --in-process \
            --inputs 20000 --seed 20261031 --batch 200 --timeout 120 \
            --out-dir tmp/fuzz_nightly

      # The sanitizer corpus is where the value-lifetime family shows up:
      # the three refcount fixes of 2026-10-31 were all found this way.
      # Compile-only (no simulator), so it belongs in CI.
      - name: Build with ASan
        run: make -C src ARCH=x86-64 SAN=1

      - name: ASan corpus (0 errors / 0 warnings under AddressSanitizer)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          python3 unit-tests/unittests.py --current \
            --compiler ./bin/beta/jalv3-x86-64-san --parallel 4 \
            --output-dir tmp/asan_corpus

      # The scheduled run has no separate analyzer job (the push-time one is
      # skipped for schedule events), so the nightly carries it. Same gate,
      # same baseline.
      - name: Static analysis (-fanalyzer, gated on a baseline)
        run: unit-tests/run_analyzer.sh

      # Line coverage of src/ over the corpus, checked against the committed
      # baseline (unit-tests/coverage_baseline.txt). ~50 s. Every other gate
      # answers "does it still work?"; this one answers "which code has no
      # test at all?". A drop below the baseline fails the run, so a change
      # that adds a large untested block is visible in the diff.
      - name: Corpus line coverage (vs baseline)
        run: python3 unit-tests/coverage_report.py --all

      - name: Upload fuzz artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-failure-artifacts
          path: |
            tmp/fuzz_nightly
            tmp/asan_corpus
          if-no-files-found: ignore
